aid: manypets
name: ManyPets
description: 'ManyPets (formerly Bought By Many, part of ManyGroup) is a digital-first
  pet insurance provider founded in 2012 by Steven Mendel and Guy Farley and headquartered
  in London, United Kingdom. The company sells lifetime dog, cat and multi-pet insurance
  direct to consumers in the UK, alongside a preventative flea/tick/worm plan, an
  online claims experience and unlimited 24/7 video vet consultations. Sister ManyGroup
  brands include ExoticDirect (exotic pet insurance) and VetBox (pet treatment subscriptions).
  ManyPets raised a $350M Series D led by EQT Growth in 2021 and has also operated
  in the United States and Sweden; the US book is transitioning to Odie. ManyPets
  does not publish a public developer portal or machine-readable API contract — its
  API is offered only through a gated partner programme (affiliate, widget, API partner,
  perk and custom solutions) operated at many-group.com/partners/.'
